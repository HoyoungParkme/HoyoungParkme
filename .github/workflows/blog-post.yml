name: Update blog posts

on:
  schedule:
    - cron: "0 */6 * * *"  # 6시간마다 블로그 확인
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # README 커밋 권한

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 최신 기술 글로 blog.svg 갱신
        run: python3 .github/scripts/update_blog.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.svg
          git diff --cached --quiet || (git commit -m "docs: 최신 블로그 글 갱신" && git push)
